<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>施老师大课堂 · ShiClass</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='48'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="data/course-catalog.js"></script>
<link rel="stylesheet" href="shared/theme.css">
<style>
:root {
  --accent-subtle: #F5E6DE;
  --radius: var(--radius-lg);
  /* ---- 流水线框架图变量（亮色） ---- */
  --fig-bg: #FBF8F3;
  --stage1: #5B7B9A; --stage1-bd: #B9C4CC; --stage1-bg: #F3EFE8; --stage1-sub: #8A93A2;
  --stage2: #CC785C; --stage2-bd: #E3B89B; --stage2-bg: #FBF0E8; --stage2-sub: #C08A6F;
  --stage3: #4E8A67; --stage3-bd: #8FBB9F; --stage3-bg: #F0F5F1; --stage3-sub: #7AA383;
  --stage4: #4E5D8A; --stage4-bd: #9AA7CE; --stage4-bg: #EDF0F7; --stage4-sub: #8B97BC;
  --stage5: #8B5A8B; --stage5-bd: #BE9FBE; --stage5-bg: #F5EFF5; --stage5-sub: #A88AA8;
  --fig-arrow: #8A7360; --fig-fb: #9A6B8F;
  --fig-pool-bd: #E6A76E; --fig-pool-ink: #8A5A2E; --fig-pool-sub: #A87A4E;
  --fig-title: #B08968; --fig-h1: #3A322A; --fig-h2: #4A5664;
  --fig-ink: #3A322A; --fig-ink60: #6B6257; --fig-ink40: #9A8F80;
  --fig-core: #2F7A4F; --fig-core-txt: #2F5E41; --fig-danger: #B03A2E;
  --fig-glow: #4E8A67;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.7;
}
.page {
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 24px;
}

/* Header */
.site-header {
  padding: 60px 0 40px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  margin-bottom: 48px;
}
.site-header h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 2.5rem;
  font-weight: 900;
  color: var(--ink);
  margin-bottom: 12px;
}
.site-header .subtitle {
  font-size: 1.05rem;
  color: var(--ink-60);
  max-width: 640px;
  margin: 0 auto;
}
.site-header .meta {
  margin-top: 16px;
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}
.site-header .meta span {
  padding: 4px 14px;
  background: var(--accent);
  color: white;
  border-radius: 20px;
  font-size: 0.8rem;
}

/* Collection Section */
.collection-section {
  margin-bottom: 56px;
}
.collection-header {
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--accent);
}
.collection-header h2 {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 4px;
}
.collection-header .col-desc {
  font-size: 0.85rem;
  color: var(--ink-60);
}
.collection-header .col-meta {
  margin-top: 6px;
  display: flex;
  gap: 8px;
}
.collection-header .col-meta span {
  font-size: 0.75rem;
  padding: 2px 10px;
  background: var(--border);
  border-radius: 12px;
  color: var(--ink-60);
}

/* Lesson Card Grid */
.lesson-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}
.lesson-card {
  background: var(--paper-light);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
              box-shadow 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
              border-color 0.25s ease;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.lesson-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  border-color: var(--accent-light);
}
.lesson-card:active {
  transform: scale(0.98);
}
.lesson-card .lesson-title {
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.4;
}
.lesson-card .lesson-subtitle {
  font-size: 0.8rem;
  color: var(--ink-60);
  line-height: 1.4;
  flex: 1;
}
.lesson-card .lesson-meta {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 4px;
}
.lesson-card .lesson-meta .dur {
  font-size: 0.72rem;
  color: var(--accent);
  font-weight: 500;
}
.lesson-card .lesson-meta .tag {
  font-size: 0.7rem;
  padding: 1px 8px;
  background: var(--accent-subtle);
  border-radius: 8px;
  color: var(--ink-60);
}

/* Footer */
.site-footer {
  margin-top: 60px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--ink-60);
  font-size: 0.85rem;
}

.workspace-topbar { font-size: 0.7rem; padding: 4px 16px; }

.workspace-topbar {
  background: rgba(204, 120, 92, 0.08);
  border-bottom: 1px solid var(--border);
  padding: 6px 24px;
  font-size: 0.8rem;
  text-align: center;
}
.workspace-topbar a {
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
}
.workspace-topbar a:hover { text-decoration: underline; color: var(--accent); }
.workspace-topbar .sep {
  color: var(--ink-60);
  margin: 0 8px;
}
.workspace-topbar .current {
  color: var(--ink-60);
}

@media (max-width: 640px) {
  .lesson-grid { grid-template-columns: 1fr; }
}

/* ===================== 流水线框架图板块 ===================== */
.pipeline-section {
  margin-bottom: 56px;
}
.pipeline-fig-wrap {
  background: var(--fig-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 10px 10px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.pipeline-fig-wrap svg {
  display: block;
  width: 100%;
  height: auto;
  min-width: 860px; /* 手机端横向滚动，保证可读 */
}
.pipeline-fig-wrap text {
  font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
.pipeline-hint {
  text-align: center;
  font-size: 0.72rem;
  color: var(--ink-40);
  padding: 4px 0 0;
}
@media (min-width: 641px) {
  .pipeline-hint { display: none; }
}

/* 流水线框架图暗色模式变量覆盖 */
@media (prefers-color-scheme: dark) {
  :root {
    --fig-bg: #17172A;
    --stage1: #8FB4D8; --stage1-bd: #4E6278; --stage1-bg: rgba(91,123,154,0.13); --stage1-sub: #8FA6BE;
    --stage2: #E8A88C; --stage2-bd: #8A6A55; --stage2-bg: rgba(204,120,92,0.13); --stage2-sub: #C79C85;
    --stage3: #7AB893; --stage3-bd: #4E6B5A; --stage3-bg: rgba(78,138,103,0.13); --stage3-sub: #8FB8A0;
    --stage4: #8B97BC; --stage4-bd: #4E5570; --stage4-bg: rgba(78,93,138,0.15); --stage4-sub: #9AA5C4;
    --stage5: #C09AC0; --stage5-bd: #6A5580; --stage5-bg: rgba(139,90,139,0.15); --stage5-sub: #B59CB5;
    --fig-arrow: #A89A85; --fig-fb: #C09AC0;
    --fig-pool-bd: #C8924F; --fig-pool-ink: #D9B080; --fig-pool-sub: #C3A06F;
    --fig-title: #D9A88A; --fig-h1: #F0EDEA; --fig-h2: #B9C4D0;
    --fig-ink: #F0EDEA; --fig-ink60: #B5B0A8; --fig-ink40: #8A857E;
    --fig-core: #7AB893; --fig-core-txt: #B0E0C4; --fig-danger: #FF9C8E;
    --fig-glow: #7AB893;
  }
  .pipeline-fig-wrap {
    background: var(--fig-bg);
    border-color: var(--border);
  }
}
</style>
</head>

<script>
(function() {
  'use strict';
  const data = window.SHICLASS_DATA || { collections: [], lessons: [] };
  const main = document.getElementById('mainContent');

  // ---- Safe localStorage reader ----
  function lsGet(key, def) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; }
  }

  // ---- Derive short lesson ID (same algorithm as lesson-tools.js) ----
  function shortId(str) {
    const d = str.match(/^(\d+)/);
    if (d) return d[1];
    const k = str.match(/^(KF-L\d+)/i);
    if (k) return k[1].toUpperCase();
    const e = str.match(/^([A-Za-z][A-Za-z0-9-]*)/);
    if (e) return e[1];
    return str;
  }

  // ---- Compute progress ----
  const doneSet = new Set(lsGet('shiclass_done', []));
  const totalLessons = data.lessons.length;
  let doneCount = 0;
  const colProgress = {};
  for (const lesson of data.lessons) {
    const sid = shortId(lesson.id || lesson.path || '');
    const isDone = doneSet.has(sid);
    if (isDone) doneCount++;
    const cid = lesson.collectionId || 'uncategorized';
    if (!colProgress[cid]) colProgress[cid] = { done: 0, total: 0 };
    colProgress[cid].total++;
    if (isDone) colProgress[cid].done++;
  }

  // ---- Progress bar HTML (10-character block bar, each = 10%) ----
  function renderProgress(done, total) {
    if (total === 0) return '';
    const pct = Math.round((done / total) * 100);
    const filled = Math.min(Math.round(pct / 10), 10);
    const bar = '\u2588'.repeat(filled) + '\u2591'.repeat(10 - filled);
    return '<div class="col-progress"><span class="col-bar">' + bar + '</span> <span class="col-progress-text">' + done + '/' + total + ' \u8282\u5df2\u5b66</span></div>';
  }

  // ---- Escaping helpers ----
  function escHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }
  function escAttr(str) {
    return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ---- Main render ----
  function render() {
    // Update hero stats
    const heroMeta = document.querySelector('.site-header .meta');
    if (heroMeta) {
      const firstSpan = heroMeta.querySelector('span:first-child');
      if (firstSpan) firstSpan.textContent = '\u2705 ' + doneCount + '/' + totalLessons + ' \u8282\u5df2\u5b66';
    }

    let html = '';

    // Group lessons by their collectionId
    const grouped = {};
    for (const lesson of data.lessons) {
      const cid = lesson.collectionId || 'uncategorized';
      if (!grouped[cid]) grouped[cid] = [];
      grouped[cid].push(lesson);
    }

    const orderedCollections = data.collections || [];

    for (const col of orderedCollections) {
      const lessons = grouped[col.id] || [];
      if (lessons.length === 0) continue;

      const prog = colProgress[col.id] || { done: 0, total: 0 };

      html += '<section class="collection-section">'
        + '<div class="collection-header">'
        + '<h2>' + (col.kind || '\u8bfe\u7a0b') + '\uff1a' + escHtml(col.title) + '</h2>'
        + renderProgress(prog.done, prog.total)
        + '<div class="col-desc">' + escHtml(col.description || '') + '</div>'
        + '<div class="col-meta">' + (col.meta||[]).map(function(m) { return '<span>' + escHtml(m) + '</span>'; }).join('') + '</div>'
        + '</div>'
        + '<div class="lesson-grid animate-stagger">';

      for (const lesson of lessons) {
        const tags = lesson.tags || [];
        html += '<a class="lesson-card" href="' + escAttr(lesson.path || '#') + '">'
          + '<div class="lesson-title">' + escHtml(lesson.title || '') + '</div>'
          + '<div class="lesson-subtitle">' + escHtml(lesson.subtitle || '') + '</div>'
          + '<div class="lesson-meta">'
          + '<span class="dur">' + escHtml(lesson.duration || '') + '</span>'
          + tags.slice(0,3).map(function(t) { return '<span class="tag">' + escHtml(t) + '</span>'; }).join('')
          + '</div>'
          + '</a>';
      }

      html += '</div></section>';
    }

    main.innerHTML = html;
  }

  // Inject styles for progress bars & bookmark cards
  (function addStyles() {
    if (document.getElementById('scl-index-style')) return;
    const s = document.createElement('style');
    s.id = 'scl-index-style';
    s.textContent = '.col-progress{display:flex;align-items:center;gap:8px;margin:6px 0 4px}'
      + '.col-bar{font-size:1rem;letter-spacing:1px;color:var(--accent,#CC785C)}'
      + '.col-progress-text{font-size:0.8rem;color:var(--accent,#CC785C);font-weight:500}';
    document.head.appendChild(s);
  })();

  render();

})();
</script>
